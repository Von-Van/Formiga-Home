name: release

on:
  push:
    tags: ["v*"]

# Only the publish job writes, to make the release; the checks and the packaging jobs only read
# the code.
permissions:
  contents: read

jobs:
  # The same checks as every push, on the tagged commit itself, and on macOS that every place
  # names the release's version and Desktop tag: nothing is published unless they pass.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: runner.os == 'macOS'
        run: bash scripts/set-version.sh --check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  package-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: bash scripts/package-macos.sh
        env:
          FORMIGA_HOME_VERSION: ${{ github.ref_name }}
          FORMIGA_HOME_BUILD_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos
          if-no-files-found: error
          path: |
            dist/Formiga-Home-*-macOS-universal.dmg
            dist/Formiga-Home-*-macOS-universal.dmg.sha256
            dist/Formiga-Home-*-macOS-universal.zip
            dist/Formiga-Home-*-macOS-universal.zip.sha256

  package-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: dotnet tool install --global wix --version 4.0.5
      - shell: pwsh
        run: ./scripts/package-windows.ps1
        env:
          FORMIGA_HOME_VERSION: ${{ github.ref_name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            dist/Formiga-Home-*-windows-x64.msi
            dist/Formiga-Home-*-windows-x64.msi.sha256
            dist/Formiga-Home-*-windows-x64.zip
            dist/Formiga-Home-*-windows-x64.zip.sha256

  publish:
    needs: [test, package-macos, package-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check the version and take its notes from the changelog
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # The tag must be the version the app reports, or Desktop would see another.
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$crate" != "$version" ]; then
            echo "The tag says $version but Cargo.toml says $crate" >&2
            exit 1
          fi
          # This version's notes are its section of the changelog.
          awk -v want="## $version" '
            /^## / { if (found) exit; if ($0 == want || index($0, want " ") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          printf '\nUnsigned build. A SHA-256 checksum file is included for every download.\n' >> notes.md
          # A tag whose message carries the line "Formiga-Release: draft" publishes a draft, seen
          # only by the repository's owners until it is published, so every app of a joint release
          # can be tried before any goes out. The checkout keeps only the commit, so fetch the tag.
          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG"
          # A lightweight tag has no message of its own, and %(contents) would read its commit's.
          if [ "$(git cat-file -t "$TAG")" = tag ] && git tag -l --format='%(contents)' "$TAG" | grep -qx 'Formiga-Release: draft'; then
            echo "draft=true" >> "$GITHUB_OUTPUT"
          else
            echo "draft=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: notes.md
          draft: ${{ steps.notes.outputs.draft == 'true' }}
          files: release/*
          fail_on_unmatched_files: true
