[workspace]
members = ["crates/formiga-home"]
resolver = "2"

[workspace.package]
version = "0.67.3"
edition = "2024"
rust-version = "1.97"
authors = ["Formiga contributors"]
publish = false

[workspace.dependencies]
# Formiga Desktop's shared crates, all four from the same Desktop release so their types agree:
# the household contract among them, which is Desktop's. Move all four to a new release's tag
# together.
formiga-art = { git = "https://github.com/Von-Van/Formiga-Desktop", tag = "v0.67.5" }
formiga-core = { git = "https://github.com/Von-Van/Formiga-Desktop", tag = "v0.67.5" }
formiga-home-contract = { git = "https://github.com/Von-Van/Formiga-Desktop", tag = "v0.67.5" }
formiga-travel = { git = "https://github.com/Von-Van/Formiga-Desktop", tag = "v0.67.5" }

anyhow = "1.0.104"
directories = "5.0.1"
eframe = "0.36.2"
png = "0.18.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros", "parsing", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
