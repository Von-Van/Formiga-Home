[workspace]
members = ["crates/formiga-home"]
resolver = "2"

[workspace.package]
version = "0.68.23"
edition = "2024"
rust-version = "1.97"
authors = ["Formiga contributors"]
publish = false

[workspace.dependencies]
# Formiga Desktop's shared crates, all from the same Desktop release so their types agree: the
# household contract among them, which is Desktop's. Move them all to a new release's tag
# together. Between releases they may sit on one Desktop commit instead, all on the same one,
# until that release is tagged.
formiga-art = { git = "https://github.com/Von-Van/Formiga-Desktop", rev = "e238e743026810c0eb9a6dfcf93bf5a4396da055" }
formiga-core = { git = "https://github.com/Von-Van/Formiga-Desktop", rev = "e238e743026810c0eb9a6dfcf93bf5a4396da055" }
formiga-home-contract = { git = "https://github.com/Von-Van/Formiga-Desktop", rev = "e238e743026810c0eb9a6dfcf93bf5a4396da055" }
formiga-travel = { git = "https://github.com/Von-Van/Formiga-Desktop", rev = "e238e743026810c0eb9a6dfcf93bf5a4396da055" }
# The notebooks' pencil hand, and the writing on their ruled lines, from the same Desktop.
formiga-pencil = { git = "https://github.com/Von-Van/Formiga-Desktop", rev = "e238e743026810c0eb9a6dfcf93bf5a4396da055" }

anyhow = "1.0.104"
directories = "5.0.1"
eframe = "0.36.2"
png = "0.18.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros", "parsing", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
